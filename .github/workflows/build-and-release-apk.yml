name: Build & Publish Bhoomgaadi APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g. v1.0.0)"
        required: false
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare debug signing keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkey -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Prepare APK for release
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Bhoomgaadi-Procurement-v1.0.0.apk

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bhoomgaadi-Procurement-APK
          path: Bhoomgaadi-Procurement-v1.0.0.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag || 'v1.0.0' }}
          name: "Bhoomgaadi Procurement ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag || 'v1.0.0' }}"
          body: "Automated build of Bhoomgaadi Procurement offline-first Android APK."
          files: Bhoomgaadi-Procurement-v1.0.0.apk
          make_latest: true
